[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "generative-agents"
authors = [
    {name = "Alexander Gruhl", email = "gruhl.alexander@gmail.com"},
]
description = "A simulation framework for generative agents."
readme = "README.md"
requires-python = ">3.12"
keywords = ["generative agents", "llm", "sim"]
license = {text = "MIT"}
classifiers = [
    "Programming Language :: Python :: 3",
]
dependencies = [
    "aiohttp>=3.13.3",
    "colorama>=0.4.6",
    "dspy>=3.1.3",
    "loguru>=0.7.3",
    "matplotlib>=3.10.8",
    "pathfinding>=1.0.20",
    "python-socketio>=5.12.1",
    "qdrant-client>=1.7.0",
    "sentence-transformers>=5.2.2",
    "ruff>=0.15.1",
    "pytest",
]
dynamic = ["version"]

[tool.setuptools.dynamic]
version = {attr = "generative_agents.version"}

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = [
    "frontend",
    "experiments",
    "manual_mapping",
    "*.ipynb",
]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

