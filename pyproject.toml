[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "generative-agents"
authors = [
    {name = "Alexander Gruhl", email = "gruhl.alexander@gmail.com"},
]
description = "A simulation framework for generative agents."
readme = "README.md"
requires-python = ">3.12"
keywords = ["generative agents", "llm", "sim"]
license = {text = "MIT"}
classifiers = [
    "Programming Language :: Python :: 3",
]
dependencies = [
    "dspy>=3.1.3",
    "matplotlib>=3.10.8",
    "pathfinding>=1.0.20",
]
dynamic = ["version"]

[tool.setuptools.dynamic]
version = {attr = "generative_agents.version"}
